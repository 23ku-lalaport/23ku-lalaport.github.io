<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>商品管理</title>
<style>
  :root{--bg:#f7f3ec;--paper:#fffdf9;--ink:#2b2622;--muted:#6f655c;--navy:#2f3a4f;--camel:#a8794a;--line:#e3dacd;--ok:#2e7d4f;--bad:#b23b3b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:19px;line-height:1.6;padding:16px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:26px;margin:8px 0 4px}
  .sub{color:var(--muted);font-size:16px;margin-bottom:20px}
  .box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
  h2{font-size:21px;margin-bottom:14px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  label small{font-weight:400;color:var(--muted)}
  input,select{width:100%;font:inherit;padding:12px 14px;border:1px solid #cfc4b4;border-radius:8px;background:#fff}
  .photo{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:2px dashed #cfc4b4;border-radius:10px;min-height:180px;cursor:pointer;color:var(--muted);text-align:center;overflow:hidden;background:#fff}
  .photo img{max-height:320px;width:auto}
  .photo input{display:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px}
  .big{width:100%;background:var(--navy);color:#fff;padding:16px;font-size:21px;margin-top:22px}
  .big:disabled{opacity:.5}
  .msg{margin-top:14px;font-weight:600;min-height:1.6em}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item img,.item .noimg{width:64px;height:84px;object-fit:cover;border-radius:6px;background:#eee8df;flex:none}
  .item .t{flex:1;min-width:0}
  .item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .t span{font-size:15px;color:var(--muted)}
  .item button{padding:10px 14px;font-size:16px;background:#eee8df;color:var(--ink);flex:none}
  .item.off{opacity:.55}
  .item.off button{background:var(--camel);color:#fff}
  a{color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
  <h1>商品管理</h1>
  <p class="sub">上傳後大約 10 秒，<a href="./" target="_blank">網站</a>重新整理就會看到。</p>

  <div class="box">
    <label for="pw">管理密碼</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="輸入密碼">
  </div>

  <form class="box" id="form">
    <h2>新增衣服</h2>
    <label class="photo" id="photoBox">
      <span id="photoHint">📷<br>點這裡拍照或選照片</span>
      <input type="file" id="file" accept="image/*">
    </label>

    <label for="name">名稱 <small>（必填）</small></label>
    <input id="name" required placeholder="例如：針織開襟外套">

    <label for="cat">分類</label>
    <input id="cat" list="cats" placeholder="外套、上衣、褲子、裙裝…">
    <datalist id="cats"><option>外套</option><option>上衣</option><option>褲子</option><option>裙裝</option></datalist>

    <div class="row">
      <div><label for="color">顏色</label><input id="color" placeholder="米白"></div>
      <div><label for="size">尺寸</label><input id="size" placeholder="M–XL"></div>
    </div>
    <div class="row">
      <div><label for="price">價格</label><input id="price" inputmode="numeric" placeholder="3980"></div>
      <div><label for="tag">標籤</label>
        <select id="tag"><option value="">不加</option><option>新品</option><option>熱銷</option><option>特價</option></select></div>
    </div>

    <button class="big" id="send" type="submit">上傳</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="box">
    <h2>目前的衣服</h2>
    <p class="sub" style="margin-bottom:8px">按「下架」網站就不會顯示，按「上架」再顯示回來。</p>
    <div id="list"><button class="big" id="loadList" type="button" style="margin-top:0">載入列表</button></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const URL_ = (window.SHOP||{}).SCRIPT_URL || "";
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const photoURL = l => { const m=(l||"").match(/\/d\/([\w-]{20,})/)||(l||"").match(/[?&]id=([\w-]{20,})/); return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w300`:""; };

try{ $("pw").value = localStorage.getItem("shop-pw")||""; }catch(e){}
$("pw").addEventListener("change",()=>{ try{ localStorage.setItem("shop-pw",$("pw").value); }catch(e){} });

function say(text, ok){ const m=$("msg"); m.textContent=text; m.className="msg "+(ok?"ok":"bad"); }

async function call(payload){
  if(!URL_) throw new Error("還沒設定 SCRIPT_URL（config.js）");
  const res = await fetch(URL_, {method:"POST", body:JSON.stringify({...payload, password:$("pw").value})});
  const data = await res.json();
  if(!data.ok) throw new Error(data.error||"發生錯誤");
  return data;
}

/* 照片：縮小到最長邊 1400px，上傳更快 */
let photo = null;
$("file").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  $("photoHint").textContent = "照片處理中…";
  try{
    const img = await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=URL.createObjectURL(f); });
    const k = Math.min(1, 1400/Math.max(img.width,img.height));
    const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const dataUrl = c.toDataURL("image/jpeg",0.85);
    photo = dataUrl.split(",")[1];
    $("photoBox").querySelectorAll("img").forEach(x=>x.remove());
    $("photoHint").textContent = "";
    const pv = document.createElement("img"); pv.src = dataUrl; $("photoBox").prepend(pv);
  }catch(err){ photo=null; $("photoHint").textContent="這張照片讀不到，請換一張"; }
});

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  if(!$("pw").value){ say("請先輸入管理密碼"); $("pw").focus(); return; }
  if(!photo && !confirm("沒有選照片，確定要上傳嗎？")) return;
  $("send").disabled = true; say("上傳中，請稍等…", true);
  try{
    await call({action:"add", name:$("name").value.trim(), cat:$("cat").value.trim(), color:$("color").value.trim(),
      size:$("size").value.trim(), price:$("price").value.trim(), tag:$("tag").value, image:photo, mime:"image/jpeg"});
    say("✓ 上傳成功！", true);
    $("form").reset(); photo=null; $("photoBox").querySelectorAll("img").forEach(x=>x.remove());
    $("photoHint").innerHTML="📷<br>點這裡拍照或選照片";
    if($("list").dataset.loaded) loadList();
  }catch(err){ say("✗ "+err.message); }
  $("send").disabled = false;
});

async function loadList(){
  const box=$("list"); box.dataset.loaded=1; box.innerHTML="<p class='sub'>載入中…</p>";
  try{
    const {items} = await call({action:"list"});
    box.innerHTML = items.length ? items.slice().reverse().map(p=>`
      <div class="item ${p.show?"":"off"}">
        ${photoURL(p.img)?`<img src="${photoURL(p.img)}" alt="" referrerpolicy="no-referrer" loading="lazy">`:`<div class="noimg"></div>`}
        <div class="t"><b>${esc(p.name)}</b><span>${esc([p.cat,p.price&&("NT$ "+p.price)].filter(Boolean).join("｜"))}${p.show?"":"｜已下架"}</span></div>
        <button type="button" data-row="${p.row}" data-show="${p.show?0:1}">${p.show?"下架":"上架"}</button>
      </div>`).join("") : "<p class='sub'>還沒有衣服</p>";
  }catch(err){ box.innerHTML=`<p class="msg bad">✗ ${esc(err.message)}</p><button class="big" type="button" onclick="loadList()" style="margin-top:8px">重新載入</button>`; }
}
$("list").addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="loadList"||!b.dataset.row){ if(b.id==="loadList") loadList(); return; }
  b.disabled=true; b.textContent="處理中…";
  try{ await call({action:"show", row:Number(b.dataset.row), show:b.dataset.show==="1"}); loadList(); }
  catch(err){ alert(err.message); b.disabled=false; b.textContent=b.dataset.show==="1"?"上架":"下架"; }
});
</script>
</body>
</html>
