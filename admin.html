<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>商品管理｜台中LaLaport23區</title>
<style>
  :root{--bg:#f7f3ec;--paper:#fffdf9;--ink:#2b2622;--muted:#6f655c;--navy:#2f3a4f;--camel:#a8794a;--line:#e3dacd;--ok:#2e7d4f;--bad:#b23b3b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:19px;line-height:1.6;padding:16px}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:26px;margin:8px 0 4px}
  .sub{color:var(--muted);font-size:16px;margin-bottom:20px}
  .box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
  .box.editing{border:2px solid var(--camel)}
  h2{font-size:21px;margin-bottom:14px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  label small,.lbl small{font-weight:400;color:var(--muted)}
  .lbl{font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  input,select,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid #cfc4b4;border-radius:8px;background:#fff}
  textarea{min-height:96px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px}
  .big{width:100%;background:var(--navy);color:#fff;padding:16px;font-size:21px;margin-top:22px}
  .big:disabled{opacity:.5}
  .ghost{width:100%;background:#eee8df;color:var(--ink);padding:14px;font-size:18px;margin-top:10px}
  .msg{margin-top:14px;font-weight:600;min-height:1.6em}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}

  /* 照片格 */
  .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .shot{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#eee8df}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:32px;padding:0}
  .shot .cover{position:absolute;left:0;right:0;bottom:0;background:rgba(168,121,74,.92);color:#fff;font-size:13px;text-align:center;padding:2px 0}
  .shot .mv{position:absolute;left:4px;top:4px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--ink);font-size:15px;padding:0}
  .add{aspect-ratio:3/4;border:2px dashed #cfc4b4;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:15px;cursor:pointer;background:#fff;text-align:center}
  .add input{display:none}
  .add b{font-size:28px;line-height:1}
  .hint{font-size:14px;color:var(--muted);margin-top:8px}

  .item{padding:14px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item .top{display:flex;gap:12px;align-items:center}
  .item img,.item .noimg{width:64px;height:84px;object-fit:cover;border-radius:6px;background:#eee8df;flex:none}
  .item .t{flex:1;min-width:0}
  .item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .t span{font-size:15px;color:var(--muted)}
  .item .note{font-size:15px;color:var(--muted);margin-top:6px;white-space:pre-line}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .acts button{padding:10px 6px;font-size:16px;background:#eee8df;color:var(--ink)}
  .acts .del{background:#f6e3e3;color:var(--bad)}
  .item.off .t,.item.off img{opacity:.55}
  .item.off .tog{background:var(--camel);color:#fff}
  a{color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
  <h1>商品管理</h1>
  <p class="sub">台中LaLaport23區｜改完大約 10 秒，<a href="./" target="_blank">網站</a>重新整理就會看到。</p>

  <div class="box">
    <label for="pw" style="margin-top:0">管理密碼</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="輸入密碼">
  </div>

  <form class="box" id="form">
    <h2 id="formTitle">新增衣服</h2>

    <div class="lbl">照片 <small id="count">0 / 15 張</small></div>
    <div class="shots" id="shots"></div>
    <p class="hint">可一次選多張。第 1 張是封面；按照片左上角的「◀」可以往前移。</p>

    <label for="brand">放在哪一區</label>
    <select id="brand"><option>23區</option><option>SELECT</option></select>

    <label for="name">名稱 <small>（必填）</small></label>
    <input id="name" required placeholder="例如：針織開襟外套">

    <label for="cat">分類</label>
    <select id="cat"></select>
    <input id="newCat" hidden maxlength="12" placeholder="輸入新類別，例如：包包、鞋子、皮帶" style="margin-top:8px">

    <div class="row">
      <div><label for="color">顏色</label><input id="color" placeholder="米白"></div>
      <div><label for="size">尺寸</label><input id="size" placeholder="M–XL"></div>
    </div>
    <div class="row">
      <div><label for="price">價格</label><input id="price" inputmode="numeric" placeholder="3980"></div>
      <div><label for="tag">標籤</label>
        <select id="tag"><option value="">不加</option><option>新品</option><option>熱銷</option><option>特價</option></select></div>
    </div>

    <label for="note">備註 <small>（客人點開衣服時會看到，例如材質、搭配建議）</small></label>
    <textarea id="note" placeholder="例如：羊毛混紡，保暖不刺癢；可搭配直筒褲"></textarea>

    <button class="big" id="send" type="submit">上傳</button>
    <button class="ghost" id="cancel" type="button" hidden>取消編輯</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="box">
    <h2>目前的衣服</h2>
    <p class="sub" style="margin-bottom:8px">「下架」是暫時不顯示，之後可以再上架；「刪除」會連照片一起刪掉。</p>
    <div id="list"><button class="big" id="loadList" type="button" style="margin-top:0">載入列表</button></div>
  </div>
</div>

<script src="config.js"></script>
<script>
const CATS = ["外套","上衣","針織","褲子","襯衫","背心"];
const MAX = 15;
const URL_ = (window.SHOP||{}).SCRIPT_URL || "";
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const driveId = l => { const m=(l||"").match(/\/d\/([\w-]{20,})/)||(l||"").match(/[?&]id=([\w-]{20,})/); return m?m[1]:""; };
const thumb = (l,w=300) => driveId(l) ? `https://drive.google.com/thumbnail?id=${driveId(l)}&sz=w${w}` : "";
const imgsOf = p => p.imgs || (p.img ? [p.img] : []);

/* ---------- 類別：固定的 + 已經用過的 + 自己新增的 ---------- */
let extraCats = [];
try{ extraCats = JSON.parse(localStorage.getItem("shop-cats")||"[]"); }catch(e){}
const allCats = () => [...new Set([...CATS, ...extraCats, ...items.map(p=>p.cat).filter(Boolean)])];
function fillCats(sel){
  const cats = allCats();
  if(sel && !cats.includes(sel)) cats.push(sel);
  $("cat").innerHTML = cats.map(c=>`<option>${esc(c)}</option>`).join("") + `<option value="__new">＋ 新增類別…</option>`;
  $("cat").value = sel || CATS[0];
  $("newCat").hidden = true; $("newCat").value = "";
}
function rememberCat(c){
  if(!c || CATS.includes(c) || extraCats.includes(c)) return;
  extraCats.push(c); try{ localStorage.setItem("shop-cats", JSON.stringify(extraCats)); }catch(e){}
}
$("cat").addEventListener("change", ()=>{
  const isNew = $("cat").value === "__new";
  $("newCat").hidden = !isNew;
  if(isNew) $("newCat").focus();
});
function pickedCat(){ return $("cat").value === "__new" ? $("newCat").value.trim() : $("cat").value; }
/* 打開頁面就先抓網站上已經有的類別（不用密碼） */
if(URL_) fetch(URL_).then(r=>r.json()).then(d=>{
  if(!d.ok) return;
  d.items.forEach(p=>rememberCat(p.cat));
  if(!editing && $("cat").value !== "__new") fillCats($("cat").value);
}).catch(()=>{});
try{ $("pw").value = localStorage.getItem("shop-pw")||""; }catch(e){}
$("pw").addEventListener("change",()=>{ try{ localStorage.setItem("shop-pw",$("pw").value); }catch(e){} });

function say(text, ok){ const m=$("msg"); m.textContent=text; m.className="msg "+(ok?"ok":"bad"); }

async function call(payload){
  if(!URL_) throw new Error("還沒設定 SCRIPT_URL（config.js）");
  if(!$("pw").value) throw new Error("請先在最上面輸入管理密碼");
  const res = await fetch(URL_, {method:"POST", body:JSON.stringify({...payload, password:$("pw").value})});
  const data = await res.json();
  if(!data.ok) throw new Error(data.error||"發生錯誤");
  if(payload.action!=="list" && payload.action!=="photo"){       // 有改資料 → 清掉顧客頁在這支手機的暫存
    try{ localStorage.removeItem("shop-items-v3"); localStorage.removeItem("shop-items-v2"); }catch(e){}
  }
  return data;
}

/* ---------- 照片：shots 裡每張是 {link} (已上傳) 或 {data, src} (新的) ---------- */
let shots = [];
function drawShots(){
  $("count").textContent = `${shots.length} / ${MAX} 張`;
  $("shots").innerHTML = shots.map((s,i)=>`
    <div class="shot">
      <img src="${esc(s.src || thumb(s.link,400))}" alt="" referrerpolicy="no-referrer">
      ${i>0?`<button type="button" class="mv" data-mv="${i}" aria-label="往前移">◀</button>`:""}
      <button type="button" class="x" data-x="${i}" aria-label="移除">✕</button>
      ${i===0?`<div class="cover">封面</div>`:""}
    </div>`).join("") + (shots.length<MAX ? `
    <label class="add"><b>＋</b>拍照／選照片<input type="file" id="file" accept="image/*" multiple></label>` : "");
}
$("shots").addEventListener("click", e=>{
  const x=e.target.closest("[data-x]"), mv=e.target.closest("[data-mv]");
  if(x){ shots.splice(+x.dataset.x,1); drawShots(); }
  if(mv){ const i=+mv.dataset.mv; [shots[i-1],shots[i]]=[shots[i],shots[i-1]]; drawShots(); }
});
$("shots").addEventListener("change", async e=>{
  if(e.target.id!=="file") return;
  const files=[...e.target.files];
  const room = MAX - shots.length;
  if(files.length > room) alert(`最多 ${MAX} 張，這次只會加入前 ${room} 張。`);
  say("照片處理中…", true);
  for(const f of files.slice(0,room)){
    try{
      const img = await new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=URL.createObjectURL(f); });
      const k = Math.min(1, 1200/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const src = c.toDataURL("image/jpeg",0.82);
      shots.push({src, data:src.split(",")[1]});
    }catch(err){}
  }
  say("", true); drawShots();
});

/* ---------- 新增 / 編輯 ---------- */
let editing = null, items = [], uploading = false;
/* 上傳中不小心關掉或離開頁面，會先跳出提醒 */
addEventListener("beforeunload", e=>{ if(uploading){ e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("error", e=>{ if(e.target.tagName==="IMG") e.target.style.visibility="hidden"; }, true);

function resetForm(){
  editing = null; shots = [];
  $("form").reset(); fillCats(CATS[0]); $("brand").value = "23區";
  $("form").classList.remove("editing");
  $("formTitle").textContent = "新增衣服";
  $("send").textContent = "上傳";
  $("cancel").hidden = true;
  drawShots();
}

function startEdit(p){
  editing = p;
  shots = imgsOf(p).map(link=>({link}));
  $("brand").value = (p.brand && p.brand !== "23區") ? "SELECT" : "23區";
  $("name").value = p.name; $("color").value = p.color||""; $("size").value = p.size||"";
  $("price").value = String(p.price||"").replace(/[^\d]/g,""); $("tag").value = p.tag||""; $("note").value = p.note||"";
  fillCats(p.cat || CATS[0]);
  $("form").classList.add("editing");
  $("formTitle").textContent = "編輯：" + p.name;
  $("send").textContent = "儲存修改";
  $("cancel").hidden = false;
  drawShots(); say("", true);
  $("form").scrollIntoView({behavior:"smooth"});
}
$("cancel").addEventListener("click", ()=>{ resetForm(); say("",true); });

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const cat = pickedCat();
  if(!cat){ say("請輸入新類別的名稱"); $("newCat").focus(); return; }
  if(!shots.length && !confirm("沒有照片，確定要儲存嗎？")) return;
  $("send").disabled = true; uploading = true;
  try{
    const name = $("name").value.trim();
    const fresh = shots.filter(s=>!s.link);
    let n = 0;
    for(const s of shots){                       // 新照片一張一張傳
      if(s.link) continue;
      n++; say(`上傳照片中… ${n} / ${fresh.length}`, true);
      s.link = (await call({action:"photo", name, image:s.data})).link;
      delete s.data;
    }
    say("儲存資料中…", true);
    const data = { name, brand:$("brand").value, cat, color:$("color").value.trim(), size:$("size").value.trim(),
      price:$("price").value.trim(), tag:$("tag").value, note:$("note").value.trim(), imgs:shots.map(s=>s.link) };
    if(editing) await call({action:"update", row:editing.row, oldName:editing.name, ...data});
    else await call({action:"add", ...data});
    rememberCat(cat);
    const wasEdit = !!editing;
    resetForm();
    say(wasEdit ? "✓ 已儲存修改！" : "✓ 上傳成功！", true);
    if($("list").dataset.loaded) loadList();
  }catch(err){ say("✗ "+err.message+"（已傳好的照片不會重傳，可以直接再按一次）"); }
  $("send").disabled = false; uploading = false;
});

/* ---------- 列表：編輯 / 上下架 / 刪除 ---------- */
async function loadList(){
  const box=$("list"); box.dataset.loaded=1; box.innerHTML="<p class='sub'>載入中…</p>";
  try{
    items = (await call({action:"list"})).items;
    if(!editing && $("cat").value !== "__new") fillCats($("cat").value);
    box.innerHTML = items.length ? items.map((p,i)=>({p,i})).reverse().map(({p,i})=>{
      const im = imgsOf(p);
      return `
      <div class="item ${p.show?"":"off"}">
        <div class="top">
          ${im.length?`<img src="${thumb(im[0])}" alt="" referrerpolicy="no-referrer" loading="lazy">`:`<div class="noimg"></div>`}
          <div class="t"><b>${esc(p.name)}</b><span>${esc([p.brand||"23區",p.cat,p.price&&("NT$ "+p.price),im.length&&(im.length+" 張照片")].filter(Boolean).join("｜"))}${p.show?"":"｜已下架"}</span></div>
        </div>
        ${p.note?`<div class="note">備註：${esc(p.note)}</div>`:""}
        <div class="acts">
          <button type="button" data-act="edit" data-i="${i}">編輯</button>
          <button type="button" class="tog" data-act="show" data-i="${i}">${p.show?"下架":"上架"}</button>
          <button type="button" class="del" data-act="delete" data-i="${i}">刪除</button>
        </div>
      </div>`}).join("") : "<p class='sub'>還沒有衣服</p>";
  }catch(err){ box.innerHTML=`<p class="msg bad">✗ ${esc(err.message)}</p><button class="big" type="button" id="loadList" style="margin-top:8px">重新載入</button>`; }
}
$("list").addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="loadList"){ loadList(); return; }
  const p = items[+b.dataset.i]; if(!p) return;
  const act = b.dataset.act;
  if(act==="edit"){ startEdit(p); return; }
  if(act==="delete" && !confirm(`確定要刪除「${p.name}」嗎？\n照片也會一起刪除，刪了就不能復原。\n（只想暫時不顯示的話，請用「下架」）`)) return;
  const label=b.textContent; b.disabled=true; b.textContent="處理中…";
  try{
    if(act==="show") await call({action:"show", row:p.row, oldName:p.name, show:!p.show});
    if(act==="delete"){ await call({action:"delete", row:p.row, oldName:p.name}); if(editing && editing.row===p.row) resetForm(); }
    loadList();
  }catch(err){ alert(err.message); b.disabled=false; b.textContent=label; }
});

resetForm();
</script>
</body>
</html>
